<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy Bot - Secure Trading Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e14; color: #f1f5f9; }
        .hidden-app { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- LOGIN OVERLAY -->
    <div id="loginScreen" class="w-full max-w-md bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl flex flex-col gap-5">
        <div class="text-center">
            <h1 class="text-2xl font-black text-emerald-400 tracking-wider">HOLY BOT ACCESS</h1>
            <p class="text-xs text-slate-400 mt-1">Authorized Access Only. Please verify your credentials.</p>
        </div>

        <div id="loginError" class="hidden bg-red-950/50 border border-red-800 text-red-400 text-xs p-3 rounded-lg text-center">
            Invalid email or password. Access Denied.
        </div>

        <form id="loginForm" class="flex flex-col gap-4">
            <div>
                <label class="text-xs font-bold text-slate-400 block mb-1">Email Address</label>
                <input type="email" id="userEmail" required placeholder="Enter authorized email" 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="text-xs font-bold text-slate-400 block mb-1">Password</label>
                <input type="password" id="userPassword" required placeholder="Enter password" 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>

            <button type="submit" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-lg text-sm text-white transition shadow-lg shadow-emerald-900/40 mt-2">
                Unlock Dashboard
            </button>
        </form>
        <p class="text-[10px] text-center text-slate-500">Protected by Hash Authentication</p>
    </div>

    <!-- MAIN BOT DASHBOARD CONTAINER (Protected Content) -->
    <div id="mainDashboard" class="hidden-app w-full max-w-6xl flex flex-col gap-6">
        
        <!-- Top Bar with Logout -->
        <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-xl">
            <div>
                <span class="text-xs text-slate-400">Authenticated User:</span>
                <span id="activeUser" class="text-xs font-bold text-emerald-400 ml-1"></span>
            </div>
            <button id="logoutBtn" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-800 text-xs font-bold px-3 py-1.5 rounded transition">
                Lock / Logout
            </button>
        </div>

        <!-- YOUR HOLY BOT APPLICATION CONTENT GOES HERE -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center">
            <h2 class="text-xl font-bold text-emerald-400 mb-2">HOLY BOT IS ACTIVE</h2>
            <p class="text-sm text-slate-400">Trading Bot Interface unlocked successfully.</p>
        </div>

    </div>

    <script>
        // Credentials Configuration (Email & SHA-256 Hashed Password for Security)
        const AUTH_EMAIL = "thomsonmilton@gmail.com";
        // Pre-calculated SHA-256 hash for "@62397526#"
        const AUTH_PASSWORD_HASH = "f9a4bb3bd830026e7b16d1c81dbcaed810e7b8c8d8c36b6d510b642273e86c1c"; 

        // Helper function to calculate SHA-256 Hash in browser
        async function sha256(str) {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Check Session Storage on Page Load
        document.addEventListener("DOMContentLoaded", () => {
            const session = sessionStorage.getItem("holybot_session");
            if (session === "authenticated") {
                showDashboard();
            }
        });

        // Form Submit Handler
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const emailInput = document.getElementById("userEmail").value.trim().toLowerCase();
            const passwordInput = document.getElementById("userPassword").value;
            const errorBox = document.getElementById("loginError");

            const inputHash = await sha256(passwordInput);

            if (emailInput === AUTH_EMAIL.toLowerCase() && inputHash === AUTH_PASSWORD_HASH) {
                sessionStorage.setItem("holybot_session", "authenticated");
                errorBox.classList.add("hidden");
                showDashboard();
            } else {
                errorBox.classList.remove("hidden");
            }
        });

        // Logout Handler
        document.getElementById("logoutBtn").addEventListener("click", () => {
            sessionStorage.removeItem("holybot_session");
            location.reload();
        });

        function showDashboard() {
            document.getElementById("loginScreen").classList.add("hidden-app");
            document.getElementById("mainDashboard").classList.remove("hidden-app");
            document.getElementById("activeUser").textContent = AUTH_EMAIL;
        }
    </script>
</body>
</html>
